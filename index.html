<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Music - 1080x1920</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a1217;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 1080px;
            height: 1920px;
            background: #0b1419;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Em telas menores, adiciona scroll */
        @media (max-width: 1080px) or (max-height: 1920px) {
            body { display: block; }
            .container { margin: 0 auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <iframe 
            src='https://music.amazon.com.br/embed/B0GFP191KN/?id=2SKplT2yF4&marketplaceId=ART4WZ8MWBX2Y&musicTerritory=BR' 
            frameborder='0'
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
            allowfullscreen>
        </iframe>
    </div>
</body>
</html>
