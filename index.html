<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Music - Álbum</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a1217;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .container {
            max-width: 680px;
            width: 100%;
            background: #101c22;
            border-radius: 2rem;
            padding: 1.8rem;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }
        .cover {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
        .cover img {
            width: 200px;
            height: 200px;
            border-radius: 1.2rem;
            object-fit: cover;
            box-shadow: 0 12px 25px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.15);
        }
        iframe {
            width: 100%;
            height: 420px;
            border-radius: 1.2rem;
            border: none;
            background: #0b1419;
        }
        hr {
            margin: 1rem 0;
            border-color: #2c4a40;
        }
        .small {
            text-align: center;
            font-size: 0.75rem;
            color: #7f9c91;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cover">
            <img src="https://m.media-amazon.com/images/I/81QjQmch2WL._UF1000,1000_QL80_.jpg" 
                 alt="Capa"
                 onerror="this.src='https://placehold.co/400x400/1a3a32/white?text=🎵'">
        </div>
        <iframe 
            src='https://music.amazon.com.br/embed/B0GFP191KN/?id=2SKplT2yF4&marketplaceId=ART4WZ8MWBX2Y&musicTerritory=BR' 
            frameborder='0'
            allow="autoplay; fullscreen">
        </iframe>
        <div class="small">
            ✅ Player Amazon Music compatível | Toca automaticamente
        </div>
    </div>
</body>
</html>
