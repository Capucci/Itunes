<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Music Player - Playlist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #0b2b26 0%, #0a1f1c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .music-card {
            max-width: 750px;
            width: 100%;
            background: rgba(18, 25, 30, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 2.5rem;
            padding: 1.8rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease;
        }

        /* Capa do álbum (imagem quadrada) */
        .album-cover {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .album-cover img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 1.5rem;
            box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.5);
            transition: transform 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .album-cover img:hover {
            transform: scale(1.02);
        }

        /* Título e artista */
        .album-info {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .album-title {
            font-size: 1.7rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
            margin-bottom: 0.3rem;
        }

        .artist-name {
            font-size: 1rem;
            color: #b0e0d0;
            opacity: 0.9;
        }

        /* Player / lista de músicas */
        .player-wrapper {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 1.8rem;
            padding: 0.3rem;
            margin-top: 0.5rem;
        }

        iframe {
            width: 100%;
            height: 400px;  /* Altura maior para lista ficar bem visível */
            border-radius: 1.5rem;
            border: none;
            background: #0f1a1f;
        }

        /* Texto opcional */
        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #8aa89e;
        }

        .footer-note a {
            color: #d4f1e9;
            text-decoration: none;
        }

        /* Responsivo */
        @media (max-width: 550px) {
            body { padding: 1rem; }
            .music-card { padding: 1.2rem; }
            .album-cover img { width: 160px; height: 160px; }
            .album-title { font-size: 1.4rem; }
            iframe { height: 380px; }
        }
    </style>
</head>
<body>
    <div class="music-card">
        <!-- Imagem quadrada do álbum (substitua pela URL correta se quiser) -->
        <div class="album-cover">
            <img src="https://m.media-amazon.com/images/I/81QjQmch2WL._UF1000,1000_QL80_.jpg" 
                 alt="Capa do álbum"
                 onerror="this.src='https://placehold.co/400x400/1a3a32/white?text=Álbum'">
        </div>

        <div class="album-info">
            <div class="album-title">Título do Álbum / Playlist</div>
            <div class="artist-name">Artista / Coletânea</div>
        </div>

        <div class="player-wrapper">
            <!-- Embed do Amazon Music que funciona e toca automaticamente -->
            <iframe 
                id='AmazonMusicEmbedB0GFP191KN' 
                src='https://music.amazon.com.br/embed/B0GFP191KN/?id=2SKplT2yF4&marketplaceId=ART4WZ8MWBX2Y&musicTerritory=BR' 
                frameborder='0' 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="footer-note">
            🔊 Música toca automaticamente • <a href="#" target="_blank">Amazon Music</a>
        </div>
    </div>
</body>
</html>
